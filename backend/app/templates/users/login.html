<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a1417">
    <title>Iniciar sesión · Verum</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 40 40" width="34" height="34" role="img" aria-label="Verum">
                    <defs>
                        <linearGradient id="verum-g" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#7dd3fc"/>
                            <stop offset="1" stop-color="#14b8a6"/>
                        </linearGradient>
                    </defs>
                    <circle cx="20" cy="20" r="18" fill="none" stroke="#d9b45b" stroke-width="1.5" stroke-dasharray="1.5 2.6" opacity="0.75"/>
                    <circle cx="20" cy="20" r="14" fill="none" stroke="url(#verum-g)" stroke-width="2"/>
                    <path d="M13 20.5l4.6 4.6 9-10" fill="none" stroke="url(#verum-g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>Verum</h1>
            <p>Verificación de antecedentes &middot; Ecuador</p>
        </div>
        <div class="form-group">
            <label for="username">Usuario</label>
            <div class="input-wrap">
                <i class="fas fa-user" aria-hidden="true"></i>
                <input type="text" id="username" name="username" placeholder="Tu nombre de usuario"
                       autocomplete="username" spellcheck="false" autofocus>
            </div>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
                <i class="fas fa-lock" aria-hidden="true"></i>
                <input type="password" id="password" name="password" placeholder="Tu contraseña"
                       autocomplete="current-password">
            </div>
        </div>
        <button class="btn-login" onclick="doLogin()">
            <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Iniciar sesión
        </button>
        <div class="error-msg" id="errorMsg"></div>
    </div>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
