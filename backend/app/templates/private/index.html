<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a1417">
    <title>Verum · Verificación de Antecedentes</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <!-- jsPDF suelto, no el bundle de html2pdf: aquel carga pero NO define
         window.jspdf, que es lo que usa services/pdf. Con el bundle el boton
         "Exportar PDF" fallaba siempre. html2pdf ya no se usa: el informe se
         dibuja con texto nativo, no rasterizando la pantalla. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div id="root"></div>

    <script>
        // Datos de sesion inyectados por Flask; el bundle React los lee de window.
        window.PERMISOS = {{ permisos | tojson }};
        window.ROL = {{ rol | tojson }};
        window.USUARIO = {{ user | tojson }};
    </script>
    <script type="module" src="{{ url_for('static', filename='dist/app.js') }}"></script>
</body>
</html>
