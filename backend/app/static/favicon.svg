<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Verum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6fbff"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base con gradiente y brillo superior -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#sheen)"/>

  <!-- Escudo (verificacion / debida diligencia) con borde dorado -->
  <path d="M32 11 L50 17 V32 C50 42 42.5 49 32 53.5 C21.5 49 14 42 14 32 V17 Z"
        fill="url(#shield)" stroke="#d9b45b" stroke-width="1.6"/>

  <!-- Checkmark -->
  <path d="M23 32.5 l6 6 L42 25" fill="none" stroke="url(#check)"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Destello dorado (acento de marca) -->
  <path d="M47 15 l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1 Z"
        fill="#f0cd76"/>
</svg>
